<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridPulse & Bottleneck Monitor - Scotland</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 580px; width: 100%; border-radius: 0.75rem; z-index: 1; }
        
        .leaflet-tooltip.custom-label {
            background-color: #334155;
            border: 1px solid #64748b;
            color: #f8fafc;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 6px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
        }

        @keyframes flowDash {
            to { stroke-dashoffset: -20; }
        }
        .interconnector-line {
            stroke: #38bdf8;
            stroke-width: 4;
            stroke-dasharray: 10, 10;
            animation: flowDash 1s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-700 text-slate-100 font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-emerald-400">
                ⚡ GridPulse & Bottleneck Monitor - Scotland
            </h1>
            <p class="text-slate-200">
                Live grid tracking across Wind, Solar, and Nuclear constraints, demand flows, and transmission bottlenecks.
            </p>
            <p id="last-updated" class="text-xs text-slate-300">Connecting to live feed...</p>
        </header>

        <!-- AI Executive Brief / Data Interpretation Panel (~200 Words, No Button/Caption) -->
        <div class="bg-slate-600 border border-slate-500 p-5 rounded-xl shadow-lg space-y-2">
            <h3 class="text-sm font-semibold text-emerald-300 uppercase tracking-wide">Live Grid Insights</h3>
            <p id="ai-summary-text" class="text-sm text-slate-100 leading-relaxed font-normal">
