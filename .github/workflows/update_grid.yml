name: Refresh Grid Metrics & AI Insights

on:
  schedule:
    - cron: '*/30 * * * *' # Runs automatically every 30 minutes
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Credentials & Remote
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

      - name: Set up Python and install packages
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests urllib3 google-genai

      - name: Run GridPulse update script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 Wind.py

      - name: Commit and push updated metrics
        run: |
          git add grid_metrics.json
          git status
          git diff-index --quiet HEAD || (git commit -m "Auto-update live grid metrics and AI summary [skip ci]" && git push origin main)
