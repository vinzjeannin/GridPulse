name: Refresh Grid Metrics & AI Insights

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 google-genai

      - name: Run GridPulse update script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u Wind.py
          grep '"timestamp"' grid_metrics.json

      - name: Commit and push updated metrics
        run: |
          set -x
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add grid_metrics.json
          if git diff --cached --quiet; then
            echo "NO CHANGES TO COMMIT"
          else
            git commit -m "Auto-update live grid metrics and AI summary"
            git log -1 --stat
            git push origin HEAD:main
            echo "PUSH DONE"
          fi
